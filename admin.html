<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Login | CAC Okeimole</title>
  <style>
    body { font-family: Arial; background: #f5f5f5; margin: 0; }
    .login-box { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 0 20px rgba(0,0,0,0.1); text-align: center; width: 350px; margin: 100px auto; }
    input { padding: 12px; width: 250px; margin: 10px 0; border: 2px solid #800000; border-radius: 5px; }
    button { background: #800000; color: white; padding: 12px 30px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    button:hover { background: #600000; }
    .logout-btn { background: #333; padding: 10px 20px; font-size: 0.9rem; float: right; margin: 20px; }
    #adminContent { display: none; }
    .header { background: white; padding: 15px 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); overflow: auto; }
    h1 { color: #800000; text-align: center; margin: 0; }
    iframe { width: 100%; height: 850px; border: 2px solid #800000; border-radius: 10px; }
    .warning { background: #ffe0e0; padding: 15px; border-radius: 8px; margin: 20px; text-align: center; font-weight: bold; }
  </style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen" class="login-box">
  <h2 style="color: #800000;">Admin Login</h2>
  <p>CAC Okeimole - Members Database</p>
  <input type="password" id="passwordInput" placeholder="Enter Admin Password">
  <br>
  <button onclick="checkPassword()">Login</button>
  <p id="errorMsg" style="color: red; margin-top: 10px;"></p>
</div>

<!-- ADMIN CONTENT - HIDDEN UNTIL PASSWORD IS CORRECT -->
<div id="adminContent">
  <div class="header">
    <button class="logout-btn" onclick="logout()">Logout</button>
    <h1>CAC Okeimole - Members Database</h1>
  </div>

  <div class="warning">
    ⚠️ PRIVATE PAGE - FOR PASTORS & EXCOS ONLY
  </div>

  <!-- PASTE YOUR PUBLISHED SHEET LINK HERE -->
  <div style="padding: 0 20px 20px;">
    <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vSckt1g92wpHtqkqtLUUplQzfIC3w2AktYOB5lEiQfFvyMSuNeG1tS_Rx3lAUF4SMtX_GxhlDUe8NTE/pubhtml?gid=809223692&single=true"></iframe>
  </div>
</div>

<script>
  // CHANGE THIS PASSWORD
  const correctPassword = "Okeimole2026"; 

  function checkPassword() {
    const input = document.getElementById("passwordInput").value;
    
    if(input === correctPassword) {
      document.getElementById("loginScreen").style.display = "none";
      document.getElementById("adminContent").style.display = "block";
      sessionStorage.setItem("loggedIn", "true"); // Remembers if they refresh
    } else {
      document.getElementById("errorMsg").innerText = "Wrong Password. Try again.";
    }
  }
  
  function logout() {
    sessionStorage.removeItem("loggedIn");
    document.getElementById("adminContent").style.display = "none";
    document.getElementById("loginScreen").style.display = "block";
    document.getElementById("passwordInput").value = "";
  }

  // Auto login if they refresh page
  window.onload = function() {
    if(sessionStorage.getItem("loggedIn") === "true") {
      document.getElementById("loginScreen").style.display = "none";
      document.getElementById("adminContent").style.display = "block";
    }
  }

  // Allow Enter key to submit
  document.getElementById("passwordInput").addEventListener("keypress", function(e) {
    if (e.key === "Enter") checkPassword();
  });
</script>

</body>
</html>
